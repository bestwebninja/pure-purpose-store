name: Auto-Fix Architecture Bot

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  autofix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Auto-Fix Script
        run: node scripts/auto-fix.js

      - name: Commit fixes (if any)
        run: |
          git config user.name "arch-bot"
          git config user.email "arch-bot@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "chore: auto-fix architecture violations"
          git push || true
